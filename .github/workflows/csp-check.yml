# Fails when a page's Content-Security-Policy no longer matches the page: a new inline
# <style> or style="" attribute, a new script, an inline handler. Fix: node scripts/csp.mjs
# and commit. The script is stdlib-only; nothing is installed.
name: csp check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  csp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/csp.mjs --check
