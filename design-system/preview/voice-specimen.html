<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brand voice</title>
<link rel="stylesheet" href="_preview.css">
<style>
  body { background: #F4F2EC; }
  .stage {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 18px;
    padding: 10px 0 16px;
  }
  .headline {
    font-family: "Instrument Serif", serif;
    font-size: 56px;
    line-height: 1.02;
    letter-spacing: -0.02em;
    color: #0E1A1A;
    text-wrap: balance;
    max-width: 600px;
  }
  .headline em { font-style: italic; }
  .sub {
    font-family: "Geist", sans-serif;
    font-size: 14px;
    line-height: 1.5;
    color: #5A6464;
    max-width: 520px;
  }
  .meta {
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    color: #5A6464;
    text-transform: uppercase;
    letter-spacing: 0.12em;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="meta">/ voice — headline + meta + sub</div>
    <div class="stage">
      <div class="headline">Tjugo år av ledarskap inom <em>tech.</em></div>
      <div class="sub">Stockholm-baserat, internationellt uppdragsbart. Strategisk översikt och praktisk teknisk insikt för digital transformation, interimsuppdrag och skalresa.</div>
    </div>
  </div>
</body>
</html>
