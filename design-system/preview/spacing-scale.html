<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spacing scale</title>
<link rel="stylesheet" href="_preview.css">
<style>
  body { background: #F4F2EC; }
  .header {
    display: flex; justify-content: space-between;
    font-family: "JetBrains Mono", monospace; font-size: 10px;
    text-transform: uppercase; letter-spacing: 0.12em;
    color: #5A6464;
  }
  .header b { color: #0E1A1A; font-weight: 500; }
  .stage { flex: 1; display: flex; flex-direction: column; gap: 6px; justify-content: center; padding-top: 4px; }
  .row {
    display: grid;
    grid-template-columns: 70px 60px 1fr;
    align-items: center;
    gap: 12px;
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    color: #5A6464;
  }
  .row b { color: #0E1A1A; font-weight: 500; }
  .bar {
    height: 14px;
    background: #1E8A8A;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="header">
      <span><b>Spacing scale</b> — 4px base</span>
      <span>4 / 8 / 12 / 16 / 24 / 32 / 48 / 64 / 96</span>
    </div>
    <div class="stage">
      <div class="row"><span><b>--space-1</b></span><span>4px</span><div class="bar" style="width:4px"></div></div>
      <div class="row"><span><b>--space-2</b></span><span>8px</span><div class="bar" style="width:8px"></div></div>
      <div class="row"><span><b>--space-3</b></span><span>12px</span><div class="bar" style="width:12px"></div></div>
      <div class="row"><span><b>--space-4</b></span><span>16px</span><div class="bar" style="width:16px"></div></div>
      <div class="row"><span><b>--space-5</b></span><span>24px</span><div class="bar" style="width:24px"></div></div>
      <div class="row"><span><b>--space-6</b></span><span>32px</span><div class="bar" style="width:32px"></div></div>
      <div class="row"><span><b>--space-7</b></span><span>48px</span><div class="bar" style="width:48px"></div></div>
      <div class="row"><span><b>--space-8</b></span><span>64px</span><div class="bar" style="width:64px"></div></div>
      <div class="row"><span><b>--space-9</b></span><span>96px</span><div class="bar" style="width:96px"></div></div>
      <div class="row"><span><b>--space-10</b></span><span>128px</span><div class="bar" style="width:128px"></div></div>
    </div>
  </div>
</body>
</html>
