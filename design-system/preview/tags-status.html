<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tags + status</title>
<link rel="stylesheet" href="_preview.css">
<style>
  body { background: #F4F2EC; font-family: "Geist", sans-serif; color: #0E1A1A; }
  .header {
    display: flex; justify-content: space-between;
    font-family: "JetBrains Mono", monospace; font-size: 10px;
    text-transform: uppercase; letter-spacing: 0.12em;
    color: #5A6464;
  }
  .header b { color: #0E1A1A; font-weight: 500; }
  .stage {
    flex: 1;
    display: flex; flex-direction: column;
    gap: 14px; justify-content: center;
  }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .lbl {
    width: 90px;
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    color: #5A6464;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  .tag {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    padding: 5px 10px 5px 8px;
    border-radius: 999px;
    border: 1px solid #CFC8B5;
    background: #F4F2EC;
  }
  .tag .dot { width: 6px; height: 6px; border-radius: 50%; background: #5A6464; }
  .tag.solid { background: #0E1A1A; color: #F4F2EC; border-color: #0E1A1A; }
  .tag.solid .dot { background: #1E8A8A; }
  .tag.signal { background: #D9EDED; color: #062626; border-color: #B5DBDB; }
  .tag.signal .dot { background: #1E8A8A; }
  .tag.ok .dot { background: #2C7A4B; }
  .tag.warn .dot { background: #B5651D; }
  .tag.err .dot { background: #B23B2E; }
</style>
</head>
<body>
  <div class="card">
    <div class="header">
      <span><b>Tags + status chips</b></span>
      <span>pill · mono · dot prefix</span>
    </div>
    <div class="stage">
      <div class="row">
        <span class="lbl">default</span>
        <span class="tag"><span class="dot"></span>STOCKHOLM</span>
        <span class="tag"><span class="dot"></span>INTERIM</span>
        <span class="tag"><span class="dot"></span>2026</span>
      </div>
      <div class="row">
        <span class="lbl">solid</span>
        <span class="tag solid"><span class="dot"></span>AVAILABLE Q3 '26</span>
        <span class="tag signal"><span class="dot"></span>NEW ENGAGEMENT</span>
      </div>
      <div class="row">
        <span class="lbl">status</span>
        <span class="tag ok"><span class="dot"></span>SHIPPED</span>
        <span class="tag warn"><span class="dot"></span>IN REVIEW</span>
        <span class="tag err"><span class="dot"></span>BLOCKED</span>
      </div>
    </div>
  </div>
</body>
</html>
