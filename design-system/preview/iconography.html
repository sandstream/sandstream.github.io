<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Iconography</title>
<link rel="stylesheet" href="_preview.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
  body { background: #F4F2EC; font-family: "Geist", sans-serif; color: #0E1A1A; }
  .header {
    display: flex; justify-content: space-between;
    font-family: "JetBrains Mono", monospace; font-size: 10px;
    text-transform: uppercase; letter-spacing: 0.12em;
    color: #5A6464;
  }
  .header b { color: #0E1A1A; font-weight: 500; }
  .stage {
    flex: 1;
    display: flex; flex-direction: column;
    gap: 14px; justify-content: center;
  }
  .row { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  .lbl {
    width: 130px;
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    color: #5A6464;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  .lbl b { color: #0E1A1A; font-weight: 500; display: block; }
  .mono-row { font-family: "JetBrains Mono", monospace; font-size: 18px; color: #0E1A1A; display: flex; gap: 16px; }
  .mono-row span { display: inline-flex; align-items: baseline; gap: 6px; }
  .mono-row small { font-size: 9px; color: #5A6464; letter-spacing: 0.1em; text-transform: uppercase; }
  .lucide-set { display: flex; gap: 14px; }
  .lucide-set [data-lucide] { width: 22px; height: 22px; stroke-width: 1.5; color: #0E1A1A; }
</style>
</head>
<body>
  <div class="card">
    <div class="header">
      <span><b>Iconography</b> — mono symbols + Lucide</span>
      <span>no emoji, ever</span>
    </div>
    <div class="stage">
      <div class="row">
        <span class="lbl"><b>Mono glyphs</b>~90% of needs</span>
        <div class="mono-row">
          <span>→<small>link</small></span>
          <span>↗<small>extl</small></span>
          <span>·<small>sep</small></span>
          <span>/<small>section</small></span>
          <span>↺<small>refresh</small></span>
          <span>▮<small>play</small></span>
          <span>◯<small>status</small></span>
        </div>
      </div>
      <div class="row">
        <span class="lbl"><b>Lucide</b>CDN · 1.5 stroke</span>
        <div class="lucide-set">
          <i data-lucide="menu"></i>
          <i data-lucide="x"></i>
          <i data-lucide="copy"></i>
          <i data-lucide="external-link"></i>
          <i data-lucide="calendar"></i>
          <i data-lucide="arrow-up-right"></i>
          <i data-lucide="circle"></i>
          <i data-lucide="chevron-down"></i>
        </div>
      </div>
    </div>
  </div>
  <script>
    if (window.lucide) lucide.createIcons();
  </script>
</body>
</html>
