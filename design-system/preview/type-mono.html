<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Type · Mono</title>
<link rel="stylesheet" href="_preview.css">
<style>
  body { background: #F4F2EC; }
  .header {
    display: flex; justify-content: space-between;
    font-family: "JetBrains Mono", monospace; font-size: 10px;
    text-transform: uppercase; letter-spacing: 0.12em;
    color: #5A6464;
  }
  .header b { color: #0E1A1A; font-weight: 500; }
  .stage {
    flex: 1;
    display: flex; flex-direction: column; justify-content: center; gap: 12px;
    font-family: "JetBrains Mono", monospace;
    color: #0E1A1A;
  }
  .big {
    font-size: 36px; letter-spacing: 0.02em; font-weight: 400;
  }
  .strip {
    font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
    color: #5A6464;
    display: flex; gap: 18px; flex-wrap: wrap;
  }
  .strip b { color: #0E1A1A; font-weight: 500; }
  .strip .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #1E8A8A; margin-right: 6px; vertical-align: middle; }
</style>
</head>
<body>
  <div class="card">
    <div class="header">
      <span><b>Mono</b> — JetBrains Mono</span>
      <span>metadata · timestamps · code</span>
    </div>
    <div class="stage">
      <div class="big">/01 · v2026.05 · sandstre.am</div>
      <div class="strip">
        <span><span class="dot"></span><b>STOCKHOLM</b> 59.33°N · 18.07°E</span>
        <span><b>STATUS</b> AVAILABLE Q3 '26</span>
        <span><b>LAST EDIT</b> 2026-05-13 14:22 UTC</span>
      </div>
    </div>
  </div>
</body>
</html>
