<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'none'; style-src 'self' https://fonts.googleapis.com 'sha256-RchnoCt67eqLnpU5bOMd2uF3N7iu76cId28NnQ7Vcqo=' 'unsafe-hashes' 'sha256-0glyzP+N/uqh4FauvcnkCInPQHulLtZMMgBzUO7Y+y8=' 'sha256-70tqzhf2QarwhaSHTR2G2UBVlKlHi9hG5xL4onc1Ak4=' 'sha256-MlmZY+bF3jrblneTGnJc+UeilDZtfAAP4ZTJ7lxXsSw=' 'sha256-arDdfNz+K31jyXB1ctagq3arIWfMNMG+fMzI4HWcdJo=' 'sha256-y6BsWnHKcmV1zMALKx71HeVt79y/NXRPl8hIgHIyfiY='; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'">
<title>Radii</title>
<link rel="stylesheet" href="_preview.css">
<style>
  body { background: #F4F2EC; }
  .header {
    display: flex; justify-content: space-between;
    font-family: "JetBrains Mono", monospace; font-size: 10px;
    text-transform: uppercase; letter-spacing: 0.12em;
    color: #5A6464;
  }
  .header b { color: #0E1A1A; font-weight: 500; }
  .stage {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 14px;
    align-content: center;
  }
  .demo {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 10px;
  }
  .box {
    width: 80px; height: 80px;
    background: #0E1A1A;
    position: relative;
  }
  .box.outline {
    background: transparent;
    border: 1.5px solid #0E1A1A;
  }
  .lbl {
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    color: #5A6464;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    text-align: center;
  }
  .lbl b { color: #0E1A1A; font-weight: 500; display: block; }
</style>
</head>
<body>
  <div class="card">
    <div class="header">
      <span><b>Radii</b> — sharp by default</span>
      <span>0 · 4 · 8 · 14 · pill</span>
    </div>
    <div class="stage">
      <div class="demo"><div class="box" style="border-radius:0"></div><span class="lbl"><b>--radius-0</b>0px · cards</span></div>
      <div class="demo"><div class="box" style="border-radius:4px"></div><span class="lbl"><b>--radius-sm</b>4px · code</span></div>
      <div class="demo"><div class="box" style="border-radius:8px"></div><span class="lbl"><b>--radius-md</b>8px · buttons</span></div>
      <div class="demo"><div class="box" style="border-radius:14px"></div><span class="lbl"><b>--radius-lg</b>14px · panels</span></div>
      <div class="demo"><div class="box" style="border-radius:999px; width:120px; height:48px"></div><span class="lbl"><b>--radius-pill</b>full · tags · CTA</span></div>
    </div>
  </div>
</body>
</html>
